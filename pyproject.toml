[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipa"
version = "0.1.0"
description = "Cortador automático de VODs da Twitch (keywords + kills OCR)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2025.8.6",
    "faster-whisper>=1.1.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0"]

[project.scripts]
clipa = "app:main"

[tool.setuptools]
py-modules = [
    "app", "clipper", "config", "downloader", "killtracker",
    "log", "matcher", "transcriber", "worker",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = [
    "app.py", "clipper.py", "config.py", "downloader.py",
    "killtracker.py", "log.py", "matcher.py", "transcriber.py",
    "worker.py",
]
